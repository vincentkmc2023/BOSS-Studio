<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOSS Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Playfair+Display:ital,wght@1,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#F6F3EC;--card:#fff;--ink:#14110F;--muted:#6B645C;--line:#E1DACD;--accent:#DC2E0A;--tint:#EDE6D9;--green:#1E9E5A;--shadow:0 10px 30px rgba(20,17,15,.10)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 Montserrat,system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.02em}
h1{font-weight:800;font-size:clamp(1.8rem,3.4vw,2.8rem)}
h1 i{font-family:'Playfair Display',serif;color:var(--accent);font-weight:700}
h3{font-size:1.05rem;font-weight:800}
.top{display:flex;align-items:center;gap:16px;padding:12px clamp(16px,3vw,40px);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);z-index:5}
.brand{font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.02em;cursor:pointer}
.brand i{font-family:'Playfair Display',serif;color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.badge{font:700 .66rem 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;background:var(--tint);color:var(--muted);padding:4px 10px;border-radius:999px}
.sp{flex:1}
main{max-width:1280px;margin:0 auto;padding:clamp(16px,2.5vw,32px) clamp(16px,3vw,40px) 60px}
.eb{font:700 .72rem 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sub{color:var(--muted);margin:6px 0 20px}
.hero{text-align:center;margin:10px auto 34px;max-width:820px}
.hero h1{font-size:clamp(2.6rem,7vw,5rem)}
.hero.proj h1{font-size:clamp(1.5rem,3.2vw,2.4rem);line-height:1.15}
.hero .eb{font-size:.82rem}
.hero .sub{font-size:1.2rem;margin:12px auto 0}
.sect{margin-top:64px}
.sect .hero{margin-bottom:24px}
.sty2{display:flex;flex-direction:column;text-decoration:none;color:inherit;padding:0;overflow:hidden;transition:transform .15s}
.sty2:hover{transform:translateY(-3px)}
.sty2 .th{aspect-ratio:4/5;background:var(--tint) center top/cover}
.sty2 .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.sty2 p{margin:0;color:var(--muted);font-size:.82rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow)}
.h{font:700 .72rem 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.h i{color:var(--accent);font-size:18px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.b{font:700 .82rem Montserrat,sans-serif;padding:9px 15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none}
button:hover{border-color:var(--ink)}
button.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.a{background:var(--accent);color:#fff;border-color:var(--accent)}
button.i{padding:9px 11px}
.gb .r{gap:5px;flex-wrap:nowrap}.gb .r button.i{padding:9px 8px}.gb .r button:not(.i){padding-left:11px;padding-right:11px;white-space:nowrap}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button i{font-size:16px}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=text],select,textarea{font:500 .9rem Montserrat,sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:62px}
label.l{display:block;font:700 .72rem 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.mut{font-size:.8rem;color:var(--muted);margin:8px 0 0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.proj{cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.proj:hover{transform:translateY(-3px)}
.proj .th{aspect-ratio:16/9;border-radius:14px;background:var(--tint) center top/cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:34px}
.newc{border:2px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;min-height:200px;color:var(--muted);text-align:center}
.styles{display:flex;gap:14px;margin-top:6px;align-items:flex-start}.styles>.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
#stylepick{width:100vw;margin-left:calc(50% - 50vw);padding:0 clamp(12px,2vw,28px);box-sizing:border-box}body{overflow-x:clip}
.sty{cursor:pointer;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.sty .th{background:var(--tint);position:relative}
.sty .th img{display:block;width:100%;height:auto;min-height:120px}
.sty .th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sty .th video:fullscreen,.sty .th video:-webkit-full-screen{object-fit:contain;background:#000}
.sty .th .use{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,17,15,.45);opacity:0;transition:opacity .15s}
.sty:hover .th .use{opacity:1}
.sty .th .use span{background:var(--ink);color:var(--bg);font:700 .78rem Montserrat,sans-serif;padding:9px 16px;border-radius:999px}
.sty .th [data-fsvideo]{position:absolute;top:8px;right:8px;z-index:2;background:rgba(20,17,15,.55);color:#fff;border:0;border-radius:50%;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.sty:hover .th [data-fsvideo]{opacity:1}
.sty b{display:block;padding:8px 10px;font-size:.82rem;text-align:center}
.sty.on{border-color:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:18px;padding:16px 18px;color:var(--muted);cursor:pointer;background:#fff;display:flex;align-items:center;gap:14px;text-align:left}
.drop .dicon{width:44px;height:44px;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink);flex:none}
.drop .dtext{flex:1;min-width:0}
.drop .dtext b{display:block;font-size:.95rem;color:var(--ink);overflow-wrap:anywhere}
.drop .dtext small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.drop .ok-mark{color:var(--green);font-size:22px;flex:none}
.drop .b{flex:none}
.drop.ok{border-color:var(--green);color:var(--green)}
.drop.dragover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,#fff)}
.stack{display:flex;flex-direction:column;gap:16px;max-width:860px;margin:0 auto}
.plat{cursor:pointer;border:2px solid var(--line);border-radius:16px;background:#fff;text-align:center;padding:16px 10px;font-weight:700;font-size:.85rem;position:relative}.plat i{font-size:30px;display:block;margin-bottom:4px}.plat.on{border-color:var(--accent)}
.plat.on::after{content:"✓";position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;font-size:.7rem;display:grid;place-items:center}
.plats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.vid{display:flex;gap:14px;align-items:center}.vth{width:96px;aspect-ratio:9/16;border-radius:14px;background:var(--tint);display:grid;place-items:center;color:var(--muted);font-size:30px;flex:none;overflow:hidden}
.when{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:640px){.when{grid-template-columns:1fr}}
.cal{border:1px solid var(--line);border-radius:18px;padding:12px;background:#fff}.cal .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:8px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cg span{font:700 .66rem 'JetBrains Mono',monospace;color:var(--muted)}
.cg button{border:0;background:none;border-radius:10px;padding:8px 0;justify-content:center}.cg button:hover{background:var(--tint)}.cg button.sel{background:var(--accent);color:#fff}.cg button:disabled{opacity:.3}
input[type=time]{font:500 .9rem Montserrat,sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
.sum{background:var(--tint);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:.9rem}.dim{opacity:.4;pointer-events:none}
.narrow{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.stepcard{background:var(--card);border-radius:22px;padding:20px 22px;box-shadow:var(--shadow);color:var(--ink)}
.stepcard h2{font-size:1.2rem;margin:0 0 2px;display:flex;align-items:center;gap:12px;letter-spacing:-.01em}
.num{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:1rem;flex:none}.num.done{background:var(--green)}
.say{color:var(--muted);margin:2px 0 14px 46px;font-size:.92rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.nchips{position:absolute;left:52px;right:10px;bottom:12px;margin:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.nchips::-webkit-scrollbar{display:none}.nchips .chip{flex:none;white-space:nowrap}
.chip{border:1px dashed var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:700 .78rem Montserrat,sans-serif;cursor:pointer;color:var(--ink)}.chip:hover{border-color:var(--accent);color:var(--accent)}
.sty.on{position:relative}.sty.on::after{content:"✓ Picked";position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;border-radius:999px;padding:3px 10px;font:700 .72rem Montserrat,sans-serif;z-index:2}
.go{text-align:center;padding:26px 22px}
.bigbtn{font:800 1.3rem Montserrat,sans-serif;padding:22px 46px;border-radius:999px;border:0;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 0 0 6px rgba(220,46,10,.22);display:inline-flex;gap:10px;align-items:center}
.bigbtn:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}.bigbtn i{font-size:26px}
.need{margin:12px 0 0;font-weight:700;color:var(--muted)}.need.ready{color:var(--green)}
.or{margin:20px 0 4px;color:var(--muted);font-size:.85rem}
.dropbig{padding:28px 22px;border-radius:20px}
details#adv>summary{list-style:none}details#adv>summary::-webkit-details-marker{display:none}
.guide{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.guide div{flex:1;min-width:110px;background:var(--tint);border-radius:14px;padding:10px 12px;font-size:.82rem;font-weight:700;display:flex;gap:8px;align-items:center}
.guide b{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.75rem;flex:none}
.guide div.on{background:var(--ink);color:#fff}.guide div.on b{background:var(--accent)}
button.sw.on,button.sw:hover{background:none;color:var(--ink);border:0}
button.sw{border:0;background:none;padding:0;display:flex;align-items:center;gap:10px;font-weight:700;font-size:.85rem;margin-top:12px;cursor:pointer}
button.sw i.k{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:.15s;font-size:0;flex:none}
button.sw i.k::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
button.sw.on i.k{background:var(--green)}button.sw.on i.k::after{left:21px}
.menu{position:relative}.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;display:none;min-width:230px;z-index:6}
.menu.open .pop{display:flex;flex-direction:column;gap:2px}.menu .pop button{border:0;border-radius:10px;justify-content:flex-start;width:100%}.menu .pop button:hover{background:var(--tint)}.menu .pop .dng{color:#B3261E}
.sugbox{background:#E7F6EE;border-radius:14px;padding:12px 14px;margin:0 0 12px;display:none;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:.88rem;color:#14663A}.sugbox.show{display:flex}
.foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.link{background:none!important;border:0!important;color:var(--muted);text-decoration:underline;padding:6px;font-weight:600}
.next{font:800 1.05rem Montserrat,sans-serif;padding:16px 28px;border-radius:999px;border:0;background:var(--accent);color:#fff;cursor:pointer;display:inline-flex;gap:8px;align-items:center;box-shadow:0 0 0 5px rgba(220,46,10,.2)}
.next:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.blk{margin:0 0 18px}.blk h3{font-size:1rem;margin:0 0 2px;display:flex;gap:10px;align-items:center}
.blk h3 .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.8rem;flex:none}.blk h3 .n.done{background:var(--green)}
.blk .say{color:var(--muted);margin:2px 0 10px 36px;font-size:.88rem}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ex{border:2px solid var(--line);border-radius:16px;background:#fff;padding:14px 12px;cursor:pointer;position:relative;text-align:left}
.ex i.ic{font-size:26px;display:block;margin-bottom:4px}.ex b{display:block;font-size:.85rem}.ex small{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}
.ex:has(input:checked){border-color:var(--accent);background:#FFF3EE}.ex:has(input:checked) i.ic{color:var(--accent)}
.ex:has(input:checked)::after{content:"✓";position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;font-size:.7rem;display:grid;place-items:center}
.look{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:10px;background:#fff}
.look img,.look .nolook{width:56px;height:70px;object-fit:cover;border-radius:10px;background:var(--tint);display:grid;place-items:center;color:var(--muted);font-size:24px}
.look .sp{flex:1}.look b{display:block}.look small{color:var(--muted)}.look select{width:auto}
.lock{background:#FFF1C9;border:1px solid #E8C86A;border-radius:14px;padding:10px 14px;font-weight:700;font-size:.85rem;margin-bottom:14px}
details.more>summary{cursor:pointer;font-weight:700;padding:8px 0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}@media(max-width:900px){.two{grid-template-columns:1fr}}
.badge2{display:inline-block;border-radius:99px;padding:4px 12px;font:800 .75rem Montserrat,sans-serif;background:var(--ink);color:#fff}.badge2.fin{background:var(--green)}.badge2.dr{background:var(--tint);color:var(--muted)}
.meta{color:var(--muted);font-size:.88rem;margin:4px 0 16px}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1150px){.acts{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.acts{grid-template-columns:repeat(2,1fr)}}
.acts>button,.acts>a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;padding:12px 8px;font:700 .9rem Montserrat,sans-serif;text-align:center;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
.acts>button:hover,.acts>a:hover{border-color:var(--ink)}
.acts i{font-size:26px}.acts small{font-weight:500;font-size:.72rem;opacity:.75}
.acts .main{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(220,46,10,.2)}
@media(max-width:560px){.acts{grid-template-columns:1fr}.acts>button,.acts>a{min-height:0;flex-direction:row;gap:8px}}
.how{margin-top:14px}.how details{background:var(--tint);border-radius:14px;padding:10px 14px;font-size:.85rem}
.older{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.oc{padding:12px}
.abtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.abtns>*{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;min-height:64px;padding:8px 4px;font-size:.78rem;text-align:center;border-radius:14px}.abtns i{font-size:20px}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;max-width:1100px;margin:0 auto 18px}.head h1{font-size:clamp(1.8rem,4vw,2.6rem)}
.newbtn{font:800 1.1rem Montserrat,sans-serif;padding:16px 28px;border-radius:999px;border:0;background:var(--accent);color:#fff;cursor:pointer;display:inline-flex;gap:8px;align-items:center;box-shadow:0 0 0 5px rgba(220,46,10,.2)}.newbtn i{font-size:24px}.newbtn:hover{border:0}
.pgrid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pc{background:var(--card);border-radius:22px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .15s;position:relative;border:1px solid var(--line)}
.pc:hover{transform:translateY(-3px)}.pc:has(.menu.open){z-index:7}
.pc .th{border-radius:21px 21px 0 0;aspect-ratio:16/10;background-color:var(--tint);background-repeat:no-repeat;background-position:center top;background-size:cover;position:relative}
.pc .magic{position:absolute;left:10px;top:10px;background:var(--ink);color:#fff;border-radius:99px;padding:3px 10px;font:800 .7rem Montserrat,sans-serif;display:flex;gap:4px;align-items:center}
.pc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}.pc h3{font-size:1.05rem;letter-spacing:-.01em}
.stp{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:var(--muted)}
.seg{display:flex;gap:3px;flex:1;max-width:90px}.seg i{height:6px;flex:1;border-radius:99px;background:var(--line)}.seg i.on{background:var(--green)}
.gor{display:flex;justify-content:space-between;align-items:center}.gor .open{font-weight:800;font-size:.85rem;color:var(--accent);display:flex;gap:4px;align-items:center}
.pc .menu .pop{top:auto;bottom:calc(100% + 6px);min-width:190px}
.empty2{max-width:520px;margin:30px auto;text-align:center;padding:40px 20px;border:2px dashed var(--line);border-radius:22px;background:#fff}.empty2 i{font-size:48px;color:var(--accent)}
main .steps>span{font:700 .85rem Montserrat,sans-serif;letter-spacing:0;text-transform:none;padding:8px 16px 8px 8px;display:inline-flex;align-items:center;gap:8px}
.steps span .sn{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:.75rem;flex:none}
.steps .on .sn{background:var(--accent);color:#fff}.steps .done .sn{background:#fff;color:var(--green)}
main .steps>span:not([data-step]){opacity:.55}
button.back{font:800 .85rem Montserrat,sans-serif;padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--bg);border-color:var(--ink)}button.back:hover{background:var(--accent);border-color:var(--accent)}button.back[hidden]{display:none}
#savedbadge{font:700 .78rem Montserrat,sans-serif;letter-spacing:0;text-transform:none;background:#E7F6EE;color:#14663A;display:inline-flex;gap:5px;align-items:center;padding:6px 12px}
body.darknew .top button.back{background:#F6F3EC;color:#14110F;border-color:#F6F3EC}
.homewrap{max-width:760px;min-height:100vh;margin:calc(-1*clamp(16px,2.5vw,32px)) auto -60px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.homelogo{font-weight:800;font-size:clamp(3.2rem,10vw,6.5rem);letter-spacing:-.03em;display:flex;align-items:center;gap:14px}.homelogo i{font-family:'Playfair Display',serif;color:var(--accent)}.homelogo .dot{width:40px;height:40px}
.homebtns{display:flex;flex-direction:column;gap:18px;width:100%;max-width:560px}.homebtns .bigbtn{justify-content:center;font-size:1.7rem;padding:30px 36px}.homebtns .bigbtn i{font-size:34px}
.bigbtn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:none}.bigbtn.alt:hover{background:var(--ink);color:#fff}

// Masonry: put each card in the shortest column, at its natural height, so no column ends far above the rest.
function layoutStyles() {
  const box = document.querySelector('.styles'); if (!box || document.fullscreenElement) return; // moving a fullscreen video out of its parent would exit fullscreen
  const cards = box._cards || (box._cards = [...box.querySelectorAll('.sty')]);
  const n = Math.max(2, Math.floor(box.clientWidth / 250)), cols = [];
  if (box._n === n && !box._force) return; box._n = n;
  box.replaceChildren(...Array.from({length: n}, () => { const c = document.createElement('div'); c.className = 'col'; cols.push(c); return c; }));
  cards.forEach((c) => { cols.reduce((a, b) => (b.offsetHeight < a.offsetHeight ? b : a)).append(c); });
}

// Style cards autoplay a short loop from the style's own sample video once visible, instead of
// decoding all of them at once; falls back to the static cover (already the background) if missed.
function watchStyleVideos() {
  const vids = [...document.querySelectorAll('.sty .th video[data-src]')];
  if (!vids.length) return;
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      const v = e.target;
      if (e.isIntersecting) {
        if (!v.src) v.src = v.dataset.src;
        const at = +v.dataset.at || 0;

      } else v.pause();
    });
  }, {threshold: 0.4});

}

  showWelcome(); if (API) usageRing();
})();
</script>
